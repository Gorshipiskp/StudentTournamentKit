server {
    listen 80;
    server_name _;

    # Liveness / readiness — без префикса /api
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    location = /ready {
        proxy_pass http://api:8000/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    # API (+ будущий WS upgrade); foundation probe: /api/internal/foundation/probe
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Overlay / Agent WebSocket channels (Platform API)
    location /ws/ {
        proxy_pass http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Overlay SPA (copy apps/overlay/dist → html/overlay/)
    # Also serves /watch/ (commentator) from the same build
    location /overlay/ {
        alias /usr/share/nginx/html/overlay/;
        try_files $uri $uri/ /overlay/index.html;
    }

    location /watch/ {
        alias /usr/share/nginx/html/overlay/;
        try_files $uri $uri/ /watch/index.html;
    }

    location = /watch {
        return 302 /watch/;
    }

    # Dashboard SPA (copy apps/dashboard/dist → html/director/)
    location /director/ {
        alias /usr/share/nginx/html/director/;
        try_files $uri $uri/ /director/index.html;
    }

    # Judge SPA (copy apps/judge/dist → html/judge/)
    location /judge/ {
        alias /usr/share/nginx/html/judge/;
        try_files $uri $uri/ /judge/index.html;
    }

    # Static stub
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
