# Platform stack — API + MySQL + nginx (local/dev)
# From repo root:
#   cp .env.example .env
#   docker compose --env-file .env -f infra/platform/docker-compose.yml up -d --build

name: stk-platform

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stk}
      MYSQL_USER: ${MYSQL_USER:-stk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_stk_dev}
    ports:
      - "${MYSQL_PUBLISH_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      # Always the compose service name inside the network (not host localhost)
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stk}
      MYSQL_USER: ${MYSQL_USER:-stk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_stk_dev}
    ports:
      - "${API_PUBLISH_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - api

  # WebRTC TURN — optional: docker compose --profile webrtc up -d
  coturn:
    profiles: ["webrtc"]
    image: coturn/coturn:4.6
    restart: unless-stopped
    ports:
      - "${TURN_PORT:-3478}:3478/tcp"
      - "${TURN_PORT:-3478}:3478/udp"
      - "49160-49170:49160-49170/udp"
    environment:
      TURN_SECRET: ${TURN_SECRET:-dev_turn_secret_change_me}
      TURN_REALM: ${TURN_REALM:-stk.local}
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:-dev_turn_secret_change_me}"
      - "--realm=${TURN_REALM:-stk.local}"
      - "--min-port=49160"
      - "--max-port=49170"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--no-multicast-peers"
      - "--no-stdout-timestamps"

volumes:
  mysql_data:
